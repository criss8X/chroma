name: Build Rust Release Tarball

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build release
        run: cargo build --release

      - name: Create tar.gz
        run: |
          VERSION=${{ github.ref_name }}
          tar -czvf target/chroma-v$VERSION.tar.gz -C target release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma-tarball
          path: target/chroma-v*.tar.gz
